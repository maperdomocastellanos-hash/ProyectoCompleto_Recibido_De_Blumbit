services:
  postgres_inv:
    container_name: postgres_inv
    image: postgres:16-alpine
    restart: always
    ports:
      - "${BD_PORT}:5432" # Usa la variable del .env
    environment:
      POSTGRES_DB: ${BD_DATABASE}
      POSTGRES_USER: ${BD_USERNAME}
      POSTGRES_PASSWORD: ${BD_PASSWORD}
    volumes:
      - pg_data_nest:/var/lib/postgresql/data
    networks:
      - app-backfront-network
  
  backend-nest:
    container_name: backend-nest
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - app-backfront-network
    depends_on:
      - postgres_inv
  
  frontend-angular:
    container_name: frontend-angular
    build:
      context: ./../proyecto_frontend_angular_inventarios
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-backfront-network
    depends_on:
      - backend-nest
  
  nginx_bf:
    container_name: nginx_bf
    image: nginx:alpine
    volumes:
      - ./../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "81:80"
    networks:
      - app-backfront-network
    depends_on:
      - backend-nest
      - frontend-angular

networks:
  app-backfront-network:
    driver: bridge

volumes: 
  pg_data_nest:

